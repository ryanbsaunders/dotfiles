# Shared tmux configuration -- sourced by ~/.tmux.conf on every host.
#
# Host-specific settings do NOT belong here. The prefix, status-bar colour,
# plugins and pane-border format differ per host and belong in that host's
# own ~/.tmux.conf, which sources this file and then overrides.

set -g history-limit 50000

set -g default-terminal tmux-256color
set -ga terminal-overrides ",*-256color:RGB"
setw -g xterm-keys on

set-option -g allow-rename off
set-option -g renumber-windows on
set -g base-index 1
setw -g mode-keys vi
set -g focus-events on

# vim-style pane navigation
unbind-key j
bind-key j select-pane -D
unbind-key k
bind-key k select-pane -U
unbind-key h
bind-key h select-pane -L
unbind-key l
bind-key l select-pane -R

# splits inherit the current pane's path
bind \\ split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

bind-key q set-window-option synchronize-panes \; display-message "synchronize-panes is #{?pane_synchronized,on,off}"
