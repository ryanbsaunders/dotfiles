# shared base; the rest of this file is the macOS workstation overlay
if-shell "[ -f ~/.tmux.common.conf ]" "source-file ~/.tmux.common.conf"

# use A as the prefix key instead of B
unbind C-b
set -g prefix C-a
bind a send-prefix

# set reload key to r
bind r source-file ~/.tmux.conf

# set the title bar
set -g set-titles on
set -g set-titles-string '#h'

# set status bar
set -g status-style "bold"
set -g status-bg colour24
set -g status-fg white
set -g status-interval 5
set -g status-justify left
set -g status-left-length 90
set -g status-left ''
set -g status-right-length 150
set -g status-right '#[fg=white,bg=default] | #(~/bin/tmux_ipstatus.sh) PubIP: #(~/bin/tmux_pubip.sh) #[fg=black,bg=white] #S #[fg=white,bg=default]  %a %d %b %R '

# set windows backgrounded in the status bar to white
set -g status-fg white

set-window-option -g window-status-current-style fg=black,bg=white

set -g pane-active-border-style fg=white

# use the user's login shell (Homebrew bash on Apple Silicon /
# Intel; /bin/bash as last-resort fallback) so panes inherit the
# environment from .bash_profile.
set -g default-shell "${SHELL}"

# set pane titles. Final `exec "${SHELL}" -il` makes the new pane a
# login + interactive shell, which sources .bash_profile (without
# -l, `bash -i` only reads .bashrc and the env is bare).
set -g default-command '                      \
function renamePane () {                      \
  read -p "Enter Pane Name: " pane_name;      \
  printf "\033]2;%s\033\\r:r" "${pane_name}"; \
};                                            \
export -f renamePane;                         \
exec "${SHELL}" -il'
set -g pane-border-status top
set -g pane-border-format '#[bold] #{pane_index} | #T | #{pane_current_command} #(gitmux -cfg ~/.gitmux.conf "#{pane_current_path}")  '
bind-key -T prefix P send-keys "renamePane" C-m

# plugins
set -g @plugin 'tmux-plugins/tpm'          # https://github.com/tmux-plugins/tpm
set -g @plugin 'yardnsm/tmux-1password'    # https://github.com/yardnsm/tmux-1password
set -g @plugin 'roxma/vim-tmux-clipboard'  # https://github.com/roxma/vim-tmux-clipboard
set -g @plugin 'x4121/tmux-slack-counter'  # https://github.com/x4121/tmux-slack-counter
set -g @plugin 'robhurring/tmux-spotify'

run -b '~/.tmux/plugins/tpm/tpm'

